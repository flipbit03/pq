name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Check linting / formatting
        run: uv run pre-commit run --all-files

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Type check
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      # A service container cannot be given a start command, and TLS needs
      # `-c ssl=on`, so the TLS Postgres comes from docker-compose.yml.
      - name: Start TLS Postgres
        run: docker compose up -d --wait postgres-tls

      - name: Run tests
        env:
          PQ_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PQ_TLS_DATABASE_URL: postgresql://postgres:postgres@localhost:5434/postgres?sslmode=require
        run: uv run pytest
