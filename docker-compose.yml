x-postgres: &postgres
  image: postgres:18-alpine
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 0.1s
    timeout: 0.5s
    retries: 50

services:
  postgres:
    <<: *postgres
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18 and
      # refuse to start with a volume on the old path, /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql

  # Speaks TLS only (tests/tls/pg_hba.conf rejects plain TCP), with the
  # test-only certificate in tests/tls. Some fork bugs only show over TLS: a
  # child that writes on an inherited connection desynchronises the parent's
  # record sequence numbers. Postgres requires the key to be owned by it with
  # mode 600, so only the key is copied out of the read-only mount.
  postgres-tls:
    <<: *postgres
    ports:
      - "5434:5432"
    volumes:
      - ./tests/tls:/certs-src:ro
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /certs && cp /certs-src/server.key /certs/ &&
        chown postgres /certs/server.key && chmod 600 /certs/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/certs-src/server.crt -c ssl_key_file=/certs/server.key
        -c hba_file=/certs-src/pg_hba.conf

volumes:
  pgdata:
